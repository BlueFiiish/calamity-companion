<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0d1a" />
  <meta name="description" content="Terraria Calamity + Infernum companion — interactive recursive crafting-tree browser, class guides, boss drops, and item database. Works offline." />
  <title>Calamity Companion — BlueFiiish</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <img src="./icons/icon.svg" alt="" class="brand-logo" />
      <span>Calamity <b>Companion</b></span>
    </div>
    <div class="top-right">
      <button id="shareBtn" class="share-btn" aria-label="Share app" title="Share"><span>&#128279;</span></button>
      <div class="patch-pill" id="patchPill">Calamity + Infernum</div>
    </div>
  </header>

  <main id="app"><!-- views render here --></main>

  <nav id="tabbar">
    <button class="tab" data-view="craft" aria-label="Crafting Tree"><span class="ic">&#129683;</span><span>Craft</span></button>
    <button class="tab" data-view="classes" aria-label="Classes"><span class="ic">&#9876;</span><span>Classes</span></button>
    <button class="tab" data-view="bosses" aria-label="Bosses"><span class="ic">&#128128;</span><span>Bosses</span></button>
    <button class="tab" data-view="items" aria-label="Items"><span class="ic">&#128269;</span><span>Items</span></button>
    <button class="tab" data-view="guide" aria-label="Guide"><span class="ic">&#128214;</span><span>Guide</span></button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-body" id="sheetBody" role="dialog" aria-modal="true"></div>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
